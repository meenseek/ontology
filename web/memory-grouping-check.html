  assert(confirmations === beforeConfirm + 1 && draftArea.value === content, 'cancelled reread preserves draft');
  permitDiscard = true; button('현재 기록 다시 읽기').click();
  await until(() => root.querySelector('.memory-body')?.textContent.includes(current.body), 'explicit current-record reread');
  assert(!root.textContent.includes('열어 둔 기록이나 근거의 변경을 확인했습니다.'), 'explicit reread clears stale baseline'); passed.push('explicit reread boundary');
  await beginCase('unmatched', {}, 'proposed');
  const beforeAccept = calls.length, beforeAcceptConfirm = confirmations; button('제안 보관').click(); await settle();
  assert(confirmations === beforeAcceptConfirm + 1 && calls.length === beforeAccept, 'status action respects a retained correction'); draftIsIntact('explicit discard guard');
  await editing();
  assert(document.documentElement.scrollWidth <= innerWidth, 'no horizontal overflow');
  draftArea.scrollIntoView({ block: 'center' });
  output.textContent = `PASS ${passed.length} checks\n${JSON.stringify(summary())}`;
} catch (error) {
  restoreVisibility();
  output.textContent = `FAIL\n${error instanceof Error ? error.message : String(error)}\n${JSON.stringify(summary())}`;
}
</script>
