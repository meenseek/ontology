name: meenseek-ontology
services:
  postgres:
    image: postgres:18.4-alpine
    environment:
      POSTGRES_DB: ontology
      POSTGRES_USER: ontology
      POSTGRES_PASSWORD: ${ONTOLOGY_DB_PASSWORD:?Set ONTOLOGY_DB_PASSWORD to a local alphanumeric password}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - ontology-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ontology -d ontology"]
      interval: 2s
      timeout: 2s
      retries: 20
    restart: unless-stopped
volumes:
  ontology-data:
    name: meenseek-ontology-data
